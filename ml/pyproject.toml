[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repcount"
version = "0.1.0"
description = "Offline pipeline for the fitness rep counter: keypoint extraction, data split, training and evaluation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==1.0.1",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.4.6",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]
# Stage 1: classifier training, evaluation and ONNX export.
# CPU wheels are enough — the models are small and the dataset fits in memory.
#   pip install -e "ml[dev,train]" --extra-index-url https://download.pytorch.org/whl/cpu
train = [
    "scikit-learn==1.9.1",
    "torch==2.14.0",
    "onnx==1.23.0",
    "onnxscript==0.6.2",  # required by torch.onnx.export since torch 2.9
    # Keep in step with ONNXRUNTIME_VERSION in app/src/config.js so export and browser agree.
    "onnxruntime==1.23.2",
    "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["repcount"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
