[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repcount"
version = "0.1.0"
description = "Offline pipeline for the fitness rep counter: keypoint extraction, data split, training and evaluation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==1.0.1",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.4.6",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["repcount"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
